name: Test, build, and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: npm test

  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targetPlatform: win32
            targetArch: ia32
            # The 32-bit NW.js launcher delegates recording to the x64 Node
            # runtime because @pixi/node's native WebGL dependency has no
            # upstream ia32 binary.
            nativeArch: x64
            runtimeArch: x64
            artifact: ssr-gui-windows-x86
            archive: zip
            ffmpegRelease: b6.1.1
          - os: windows-latest
            targetPlatform: win32
            targetArch: x64
            nativeArch: x64
            runtimeArch: x64
            artifact: ssr-gui-windows-x64
            archive: zip
            ffmpegRelease: b6.1.1
          - os: windows-latest
            targetPlatform: win32
            targetArch: arm64
            nativeArch: x64
            runtimeArch: x64
            artifact: ssr-gui-windows-arm64
            archive: zip
            ffmpegRelease: b6.1.1
          - os: ubuntu-latest
            targetPlatform: linux
            targetArch: x64
            nativeArch: x64
            runtimeArch: x64
            artifact: ssr-gui-linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            targetPlatform: linux
            targetArch: arm64
            nativeArch: arm64
            runtimeArch: arm64
            artifact: ssr-gui-linux-arm64
            archive: tar.gz
          - os: macos-15-intel
            targetPlatform: darwin
            targetArch: x64
            nativeArch: x64
            runtimeArch: x64
            artifact: ssr-gui-macos-x64
            archive: zip
          - os: macos-15
            targetPlatform: darwin
            targetArch: arm64
            nativeArch: arm64
            runtimeArch: arm64
            artifact: ssr-gui-macos-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      SSR_TARGET_PLATFORM: ${{ matrix.targetPlatform }}
      SSR_TARGET_ARCH: ${{ matrix.targetArch }}
      SSR_RUNTIME_ARCH: ${{ matrix.runtimeArch }}
      npm_config_arch: ${{ matrix.nativeArch }}
      FFMPEG_BINARY_RELEASE: ${{ matrix.ffmpegRelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xvfb libxi-dev libglu1-mesa-dev libglew-dev pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path "$env:RUNNER_TEMP\ssr-gui-native" -ItemType Directory -Force | Out-Null
          Invoke-WebRequest "https://ftp.gnome.org/pub/GNOME/binaries/win64/gtk+/2.22/gtk+-bundle_2.22.1-20101229_win64.zip" -OutFile "$env:RUNNER_TEMP\ssr-gui-native\gtk.zip"
          Expand-Archive "$env:RUNNER_TEMP\ssr-gui-native\gtk.zip" -DestinationPath C:\GTK -Force
          Invoke-WebRequest "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/2.1.5.1/libjpeg-turbo-2.1.5.1-vc64.exe" -OutFile "$env:RUNNER_TEMP\ssr-gui-native\libjpeg-turbo.exe"
          & "$env:RUNNER_TEMP\ssr-gui-native\libjpeg-turbo.exe" /S

      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config cairo pango libpng jpeg giflib librsvg pixman

      - name: Install JavaScript and native dependencies
        run: npm ci --no-audit --no-fund

      - name: Build headless WebGL for Linux ARM64
        if: runner.os == 'Linux' && matrix.targetArch == 'arm64'
        run: npm rebuild gl --build-from-source --verbose

      - run: npm test
      - run: npm run build

      - name: Verify packaged runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum env SSR_VERIFY_RECORDER=1 npm run verify:package

      - name: Verify packaged runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SSR_VERIFY_RECORDER = '1'
          npm run verify:package

      - name: Verify packaged runtime on macOS
        if: runner.os == 'macOS'
        run: SSR_VERIFY_RECORDER=1 npm run verify:package

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/nw/* -DestinationPath "${{ matrix.artifact }}.zip" -CompressionLevel Optimal

      - name: Archive macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: (cd build/nw && zip -qry "../../${{ matrix.artifact }}.zip" .)

      - name: Archive Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C build/nw .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
