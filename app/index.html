<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Sunniesnow Recorder</title>
	<link rel="stylesheet" href="app.css">
</head>
<body>
	<header class="app-bar">
		<div class="brand">
			<img src="assets/icon.svg" alt="" class="brand-icon">
			<div>
				<h1>Sunniesnow Recorder</h1>
				<span>ssr-gui</span>
			</div>
		</div>
		<div class="runtime-badge" id="runtime-badge">检查运行组件</div>
	</header>

	<main class="workspace">
		<form class="setup-pane" id="record-form">
			<section class="form-section">
				<div class="section-heading">
					<h2>谱面</h2>
					<span class="step-number">01</span>
				</div>
				<button class="file-picker" id="choose-level" type="button">
					<img src="icons/file-up.svg" alt="">
					<span class="file-copy">
						<strong id="level-name">选择 .ssc 文件</strong>
						<small id="level-path">未选择</small>
					</span>
				</button>
				<label class="field">
					<span>难度</span>
					<select id="chart-select" disabled>
						<option value="">自动选择</option>
					</select>
				</label>
			</section>

			<section class="form-section">
				<div class="section-heading">
					<h2>画质</h2>
					<span class="step-number">02</span>
				</div>
				<div class="segmented" aria-label="画质预设">
					<label><input type="radio" name="quality" value="compact"><span>720p <small>30 FPS</small></span></label>
					<label><input type="radio" name="quality" value="standard" checked><span>1080p <small>60 FPS</small></span></label>
					<label><input type="radio" name="quality" value="high"><span>1440p <small>60 FPS</small></span></label>
					<label><input type="radio" name="quality" value="custom"><span>自定义 <small>宽 · 高 · FPS</small></span></label>
				</div>
				<div class="resolution-row">
					<label class="field"><span>宽度</span><input id="video-width" type="number" value="1920" min="320" max="7680" step="1"></label>
					<label class="field"><span>高度</span><input id="video-height" type="number" value="1080" min="180" max="4320" step="1"></label>
					<label class="field"><span>FPS</span><input id="video-fps" type="number" value="60" min="1" max="240" step="1"></label>
				</div>
				<label class="field"><span>音符速度</span><input id="speed" type="number" value="2" min="0" max="20" step="0.1"></label>
			</section>

			<section class="form-section">
				<div class="section-heading">
					<h2>用户</h2>
					<span class="step-number">03</span>
				</div>
				<label class="field"><span>昵称</span><input id="nickname" type="text" value="New Poet"></label>
				<label class="field"><span>头像来源</span><select id="avatar-source">
					<option value="online">在线头像</option>
					<option value="upload">本地图片</option>
					<option value="gravatar">Gravatar</option>
				</select></label>
				<label class="field avatar-detail" id="avatar-online-field"><span>在线头像</span><input id="avatar-online" type="text" value="default.svg"></label>
				<label class="field avatar-detail" id="avatar-upload-field" hidden><span>头像文件</span><input id="avatar-upload" type="file" accept="image/*"></label>
				<label class="field avatar-detail" id="avatar-gravatar-field" hidden><span>Gravatar 邮箱</span><input id="avatar-gravatar" type="email" value=""></label>
			</section>

			<section class="form-section">
				<div class="section-heading">
					<h2>输出</h2>
					<span class="step-number">04</span>
				</div>
				<div class="field-row">
					<label class="field output-format-field"><span>输出格式</span><select id="output-format">
						<option value="mkv">Matroska (MKV)</option>
						<option value="mp4">MPEG-4 (MP4)</option>
						<option value="webm">WebM</option>
						<option value="mov">QuickTime (MOV)</option>
						<option value="avi">AVI</option>
						<option value="ts">MPEG Transport Stream (TS)</option>
					</select></label>
					<label class="field"><span>输出文件名</span><input id="output-filename" type="text" value="output.mkv"></label>
				</div>
				<button class="path-picker" id="choose-output" type="button" disabled>
					<img src="icons/folder-output.svg" alt="">
					<span id="output-path">选择谱面后自动生成</span>
				</button>
				<div class="toggle-row">
					<label class="toggle"><input id="wait-music" type="checkbox"><span></span>等待音乐结束</label>
					<label class="toggle"><input id="system-fonts" type="checkbox"><span></span>使用系统字体</label>
				</div>
				<label class="field compact-field"><span>结算画面</span><div class="suffix-input"><input id="results-duration" type="number" value="1" min="0" max="60" step="0.5"><em>秒</em></div></label>
			</section>

			<details class="advanced-settings">
				<summary>全部 recorder 参数</summary>
				<p class="advanced-note">这里包含尚未在上方显示的全部命令行选项。</p>
				<div id="advanced-groups"></div>
			</details>

			<div class="config-tools" aria-label="配置">
				<div class="config-tools-heading">
					<span>配置</span>
					<small id="config-status">自动保存已启用</small>
				</div>
				<div class="config-tools-actions">
					<button class="secondary-button config-button" id="save-config" type="button">保存配置</button>
					<button class="secondary-button config-button" id="import-config" type="button">导入配置</button>
					<label class="toggle config-toggle"><input id="auto-save-config" type="checkbox" checked><span></span>自动保存</label>
				</div>
			</div>

			<div class="form-actions">
				<button class="primary-button" id="start-record" type="submit" disabled>
					<span class="record-dot"></span>
					开始录制
				</button>
				<button class="icon-button" id="cancel-record" type="button" title="取消录制" disabled>
					<img src="icons/square.svg" alt="取消录制">
				</button>
			</div>
		</form>

		<section class="activity-pane" aria-live="polite">
			<div class="activity-main">
				<div class="state-mark" id="state-mark"><span></span></div>
				<p class="eyebrow" id="state-eyebrow">READY</p>
				<h2 id="state-title">等待谱面</h2>
				<p class="state-detail" id="state-detail">00:00</p>
				<div class="progress-track" aria-label="录制进度"><span id="progress-bar"></span></div>
				<button class="secondary-button" id="reveal-output" type="button" hidden>
					<img src="icons/folder-open.svg" alt="">
					打开所在文件夹
				</button>
			</div>
			<div class="log-panel">
				<div class="log-header"><span>运行日志</span><button id="clear-log" type="button" title="清空日志"><img src="icons/trash-2.svg" alt="清空日志"></button></div>
				<pre id="log-output">运行组件就绪后即可开始。</pre>
			</div>
		</section>
	</main>
	<script>
		function showStartupError(error) {
			const output = document.getElementById("log-output");
			const badge = document.getElementById("runtime-badge");
			if (output) output.textContent = error && (error.stack || error.message) || String(error || "Unknown startup error");
			if (badge) {
				badge.textContent = "启动失败";
				badge.classList.add("error");
			}
		}
		window.addEventListener("error", event => showStartupError(event.error || event.message));
		window.addEventListener("unhandledrejection", event => showStartupError(event.reason));
	</script>
	<script type="module" src="app.mjs"></script>
</body>
</html>
